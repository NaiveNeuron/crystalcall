      max_temperature: 23.0
      average_temperature: 17.0
      average_humidity: 61
      max_wind_speed: 18.0
      average_visibility_distance: 10.0
      barometric_pressure: 1013.0
      condition: Partly cloudy
      temperature_unit: Celsius
      distance_unit: Kilometer
    per_day_delta_c: 1.5
    coordinate_cell_degrees: 0.25
    coordinate_delta_c: 0.5

# --------------------------------------------------------------------------- #
# user turns
# --------------------------------------------------------------------------- #
user_turns:
  source: ScenarioExtension.messages, USER -> AGENT contents in declaration order
  # Upstream drives follow-up user turns with a live user-simulator LLM reading
  # the SYSTEM -> USER instruction.  We drive OMP, not their agent loop, so for
  # MULTIPLE_USER_TURN scenarios we append exactly one scripted follow-up: the
  # task text of that instruction with the simulator-facing preamble
  # (USER_INSTRUCTION) dropped, the prefixes below stripped and any sentence
  # matching `drop_sentences` removed.  No other turn is ever synthesised.
  multi_turn_categories: [MULTIPLE_USER_TURN]
  strip_prefixes:
    - "Ask User B to "
    - "Ask User B: "
    - "Ask User B "
  drop_sentences:
    - "You do not have any more information"
    - "You do not have more information"
    - "You do not have information"
    - "You do not know who the person is"
    - "You don not have more information"
    - "You do not any more information"
    - "You don't have the current datetime information"
    - "You do not have information of current datetime or location"
    - "You only know"
    - "Do not leak this information"
    - "It should be"
    - "Make sure it's right"

# --------------------------------------------------------------------------- #
# milestone evaluation
# --------------------------------------------------------------------------- #
milestones:
  source: ScenarioExtension.milestones / .minefields, read statically
  # A milestone is hit when every one of its snapshot constraints is satisfied.
  # We evaluate each milestone against the final world plus the full episode
  # transcript and do NOT enforce upstream's snapshot-index DAG ordering; that is
  # a documented weakening, recorded per episode as `milestone_order_enforced`.
  constraint_kinds:
    tool_trace: an authoritative call to the named tool whose canonical arguments agree on every declared key
    assistant_text: ROUGE-L F1 of the declared content against the concatenated assistant text
    addition_similarity: a row matching every declared literal column exists in the final namespace
    update_similarity: with a target, as addition_similarity; without a target, the namespace differs from the initial world
    removal_similarity: no row matching every declared literal column exists in the final namespace
    tool_trace_dependant_similarity: not reproducible without upstream's extractors -> the milestone is indeterminate
  rouge_l_threshold: 0.4
  # Numeric target columns are POSIX timestamps; they compare within this many
  # seconds.  Booleans compare exactly (see `_row_matches`), never numerically.
  numeric_tolerance: 1.0
  # A minefield names a tool the agent must not call; it is hit when the
  # transcript contains a call to that tool.
  minefield_kind: forbidden_tool_call
  order_enforced: false

# --------------------------------------------------------------------------- #
# speculation policy
# --------------------------------------------------------------------------- #
speculation:
  policy: turn_boundary_eligible_prefetch
  # At each turn boundary, against the world version current at that instant,
  # the arm launches (a) every speculation-eligible tool of the scenario surface
  # whose canonical form needs no supplied argument and (b) every
  # speculation-eligible canonical call observed authoritatively in the previous
  # turn.  Writes and live reads are never launched: `FutureTable.launch`
  # refuses them and `assert_no_write_speculation` is asserted at the launch
  # site.  A launched future is consumable only on an exact
  # (request_id, canonical_tool, canonical_arguments, immutable_snapshot_id)
  # match, so any write between launch and use moves the snapshot id and the
  # claim misses.
  max_launches_per_turn: 16
  claim_timeout_s: 60.0
  concurrency_per_resource: 4

# --------------------------------------------------------------------------- #
# GPU-free stub mode
# --------------------------------------------------------------------------- #
stub:
  # `--stub` replaces the model with a fixed OpenAI-compatible server that
  # returns exactly one `eval` program per user turn and then a final text.  The
  # program is derived from the scenario's own milestone declarations: each
  # `tool_trace` target names a tool and the arguments upstream expects, and
  # each state-namespace constraint names a mutation, which `state_tools` maps
  # back onto the tool that performs it.  Any required argument a milestone
  # leaves open is filled from `required_args` below, and every scenario's
  # program additionally calls each argument-free eligible read once before and
  # once after the writes so that the trace genuinely interleaves writes, live
  # reads and eligible snapshot reads.  Nothing is invented at run time.
  model_id: diffusiongemma-26b-a4b-it
  digest_marker: RESULTDIGEST
  # (namespace, constraint measure) -> the tool that produces that mutation, and
  # how declared target columns map onto that tool's parameters.  `id_column`
  # names a row identifier: when the milestone declares it, it is passed
  # through; otherwise the program resolves it at run time via `id_source`.
  state_tools:
    reminder:
      addition_similarity:
        tool: add_reminder
        columns: {content: content, reminder_timestamp: reminder_timestamp, latitude: latitude, longitude: longitude}
      update_similarity:
        tool: modify_reminder
        id_column: reminder_id
        id_source: search_reminder
        columns: {content: content, reminder_timestamp: reminder_timestamp, latitude: latitude, longitude: longitude}
      removal_similarity:
        tool: remove_reminder
        id_column: reminder_id
        id_source: search_reminder
        columns: {}
    contact:
      update_similarity:
        tool: modify_contact
        id_column: person_id
        id_source: search_contacts
        columns: {name: name, phone_number: phone_number, relationship: relationship, is_self: is_self}
      removal_similarity:
        tool: remove_contact
        id_column: person_id
        id_source: search_contacts
        columns: {}
    messaging:
      addition_similarity:
        tool: send_message_with_phone_number
        columns: {recipient_phone_number: phone_number, content: content}
  # The SETTING namespace has one tool per boolean column; the declared target
  # value becomes the `on` argument.
  setting_column_tools:
    wifi: set_wifi_status
    cellular: set_cellular_service_status
    location_service: set_location_service_status
    low_battery_mode: set_low_battery_mode_status
  required_args:
    add_reminder: {content: Buy chocolate milk, reminder_timestamp: 1711152000.0}
    modify_reminder: {content: Buy chocolate milk}
    remove_reminder: {}
    modify_contact: {relationship: enemy}
    remove_contact: {}
    send_message_with_phone_number: {phone_number: "+12453344098", content: "How's the new album coming along"}
    set_cellular_service_status: {"on": true}
    set_location_service_status: {"on": true}
    set_low_battery_mode_status: {"on": false}
    set_wifi_status: {"on": true}
    search_contacts: {is_self: true}
    search_messages: {creation_timestamp_lowerbound: 0.0}
    search_reminder: {creation_timestamp_lowerbound: 0.0}
    search_holiday: {holiday_name: Christmas Day}
    search_lat_lon: {latitude: 37.334606, longitude: -122.009102}
    search_location_around_lat_lon: {location: Golden Gate Bridge}
    search_weather_around_lat_lon: {days: 0}
    calculate_lat_lon_distance: {latitude_0: 37.334606, longitude_0: -122.009102, latitude_1: 37.8199, longitude_1: -122.4783}
    datetime_info_to_timestamp: {year: 2024, month: 3, day: 23, hour: 17, minute: 0, second: 0}
    shift_timestamp: {timestamp: 1711065600.0, days: 1}
    timestamp_diff: {timestamp_0: 1711065600.0, timestamp_1: 1711152000.0}
    timestamp_to_datetime_info: {timestamp: 1711065600.0}
    unit_conversion: {amount: 11.0, from_unit: celsius, to_unit: fahrenheit}
    get_current_location: {}
    get_current_timestamp: {}
    get_cellular_service_status: {}
    get_location_service_status: {}
    get_low_battery_mode_status: {}
    get_wifi_status: {}

# --------------------------------------------------------------------------- #
# the losslessness check
# --------------------------------------------------------------------------- #
divergence:
  method: one_generation_replayed_against_a_cloned_world
  # The model is sampled EXACTLY ONCE per episode.  DiffusionGemma's sampler
  # renoises the canvas with Gumbel noise and ignores the request temperature,
  # so two sequential requests are not identical even at a
  # pinned server seed; comparing two generations would confound sampling noise
  # with scheduling and could either invent a divergence or hide a real one.
  # Instead the recorded authoritative canonical call sequence is re-executed,
  # in execution order, with no future table at all, against
  # WorldState.clone() of the episode's initial world.  The generation is held
  # fixed by construction, so a mismatch can only come from scheduling.
  compare:
    - per-call result_digest, in execution order, with tool and canonical arguments
    - per-call error and canonicalization_error
    - WorldState.digest() of the final world, and of the initial world
    - evaluate_milestones(scenario, world, transcript)
  # Deliberately NOT compared: `claimed_speculative` (the replay claims nothing
  # by construction) and `snapshot_id` (a content digest of the world at the
  # moment of the call, implied by reproducing the world).
  excluded: [claimed_speculative, snapshot_id]

# --------------------------------------------------------------------------- #
# arms
# --------------------------------------------------------------------------- #
# Both arms run one generation per episode and then the same replay check; they
# differ only in whether the generation runs with the speculative launch gate.
arms:
  toolsandbox_baseline:
    speculate: false
    description: No speculation launched; ordinary scheduling generates.
  toolsandbox_crystalcall:
    speculate: true
    description: Turn-boundary eligible prefetch with exact-key claiming.

# --------------------------------------------------------------------------- #
# tool surface (derived from the checkout; see the header)
# --------------------------------------------------------------------------- #
tools:
  - name: add_reminder
    declared_class: write
    reads: [clock]
    writes: [reminder]
    external: false
    resource: cpu
    expected_duration_ms: 1.0
    concurrency_limit: 1
    params:
      - {name: content, kind: str, required: true}
      - {name: reminder_timestamp, kind: float, required: true}
      - {name: latitude, kind: float, required: false, default: null}
