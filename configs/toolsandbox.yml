# CrystalCall: the ToolSandbox validation arm, declared as data.
#
# Everything a ToolSandbox episode needs that is NOT a measurement lives here and
# is frozen before any run: the tool surface with its read/write footprint, the
# effect-assignment rule, the initial world state, the frozen clock, the
# deterministic substitutions for the upstream tools that would otherwise reach
# the network or a non-vendored library, and the speculation policy.
#
# ToolSandbox itself is NEVER imported and NEVER pip-installed.  The `reads` /
# `writes` / `declared_class` / `external` fields in the `tools:` table were
# derived statically from the checkout named under `checkout:` by walking each
# registered tool's call graph and recording which `ExecutionContext` database
# methods it reaches.  `crystalcall.toolsandbox.verify_against_checkout()`
# re-derives them from the checkout and reports any drift, so this file cannot
# silently disagree with its source.  See `docs/toolsandbox.md`.
schema: 1

checkout:
  repo: https://github.com/apple/ToolSandbox
  commit: 165848b9a78cead7ca7fe7c89c688b58e6501219
  path: experiments/vendor/toolsandbox/checkout
  imported: false
  # Module:symbol paths this adapter reads statically or reimplements.
  symbols:
    scenario_declaration: tool_sandbox/common/scenario.py:ScenarioExtension
    scenario_container: tool_sandbox/common/scenario.py:Scenario
    world_state: tool_sandbox/common/execution_context.py:ExecutionContext
    world_namespaces: tool_sandbox/common/execution_context.py:DatabaseNamespace
    world_schemas: tool_sandbox/common/execution_context.py:ExecutionContext.dbs_schemas
    world_reader: tool_sandbox/common/execution_context.py:ExecutionContext.get_database
    world_writers:
      - tool_sandbox/common/execution_context.py:ExecutionContext.add_to_database
      - tool_sandbox/common/execution_context.py:ExecutionContext.remove_from_database
      - tool_sandbox/common/execution_context.py:ExecutionContext.update_database
    categories: tool_sandbox/common/execution_context.py:ScenarioCategories
    roles: tool_sandbox/common/execution_context.py:RoleType
    milestone: tool_sandbox/common/evaluation.py:Milestone
    minefield: tool_sandbox/common/evaluation.py:Minefield
    snapshot_constraint: tool_sandbox/common/evaluation.py:SnapshotConstraint
    constraint_measures:
      - tool_sandbox/common/evaluation.py:snapshot_similarity
      - tool_sandbox/common/evaluation.py:addition_similarity
      - tool_sandbox/common/evaluation.py:removal_similarity
      - tool_sandbox/common/evaluation.py:update_similarity
      - tool_sandbox/common/evaluation.py:tool_trace_dependant_similarity
    tool_registration: tool_sandbox/common/utils.py:register_as_tool
    tool_discovery: tool_sandbox/common/tool_discovery.py:find_tools_by_module
    dataframe_filters: tool_sandbox/common/utils.py:filter_dataframe
    deterministic_uuid: tool_sandbox/common/utils.py:deterministic_uuid
    base_world: tool_sandbox/scenarios/base_scenarios.py:named_base_scenarios
    user_instruction: tool_sandbox/scenarios/user_simulator_few_shot_examples.py:USER_INSTRUCTION
    scenario_modules:
      - tool_sandbox/scenarios/multiple_tool_call_scenarios.py
      - tool_sandbox/scenarios/multiple_user_turn_scenarios.py
      - tool_sandbox/scenarios/insufficient_information_scenarios.py
    tool_modules:
      - tool_sandbox/tools/contact.py
      - tool_sandbox/tools/messaging.py
      - tool_sandbox/tools/reminder.py
      - tool_sandbox/tools/setting.py
      - tool_sandbox/tools/utilities.py
      - tool_sandbox/tools/rapid_api_search_tools.py
      - tool_sandbox/tools/user_tools.py

# --------------------------------------------------------------------------- #
# effect assignment
# --------------------------------------------------------------------------- #
# The rule is total over the scenario tool surface and is evaluated *per
# scenario*, because eligibility depends on what that scenario can write.
# Precedence is top to bottom; the first matching row wins.  The rows are
# mutually exclusive given `declared_class`, so there are no ties, and there is
# no fallback that lands on an eligible effect.
effect_rule:
  derivation:
    writer_methods: [add_to_database, remove_from_database, update_database]
    reader_methods: [get_database]
    # `datetime.datetime.now()` in an upstream body becomes a read of the frozen
    # `clock` namespace (see `world.epoch_unix`), which no tool ever writes.
    clock_marker: datetime.datetime.now
    # `requests.get` in an upstream body marks the tool externally backed.
    external_marker: requests.get
    call_graph: transitive, over module-level functions of the tool modules
  precedence:
    - id: write
      when: declared_class == write
      effect: Write
    - id: external
      when: external == true
      effect: LiveRead
    - id: conflict
      when: reads intersects the union of the writes of the scenario's tool surface
      effect: LiveRead
    - id: immutable
      when: reads is non-empty and disjoint from every in-scenario write
      effect: SnapshotRead
    - id: pure
      when: reads is empty
      effect: Pure
  unresolved: raise

# --------------------------------------------------------------------------- #
# snapshot identity
# --------------------------------------------------------------------------- #
snapshot:
  # id = "<prefix><sorted namespaces joined by '+'>@<digest>", where <digest> is
  # the first `digest_chars` hex chars of sha256 over the canonical JSON of
  # exactly those namespaces' rows -- the content digest of the immutable
  # sub-view and nothing else.
  prefix: "tsbx:"
  digest_chars: 16
  # The resolver reads the live WorldState at canonicalisation time, so the id of
  # a call issued before a write can never equal the id of the same call after
  # it, and a future launched against one world version can never be claimed
  # against another.
  resolver: crystalcall.toolsandbox.WorldState.snapshot_id

# --------------------------------------------------------------------------- #
# world
# --------------------------------------------------------------------------- #
world:
  # Frozen clock.  Upstream calls datetime.datetime.now(); a wall clock would
  # make every episode irreproducible and would make `get_current_timestamp` a
  # live read.  1711065600 = 2024-03-22T00:00:00Z, the date the frozen reminder
  # milestone targets were authored against.
  epoch_unix: 1711065600.0
  timezone: UTC
  namespaces: [clock, setting, contact, messaging, reminder]
  # Upstream row ids come from uuid4(); we substitute
  # uuid5(NAMESPACE_URL, "<namespace>:<write_seq>"), a deterministic function of
  # the authoritative call order.
  new_row_id: uuid5(NAMESPACE_URL, '<namespace>:<write_seq>')
  setting_defaults:
    device_id_payload: my_phone
    cellular: true
    wifi: true
    location_service: true
    low_battery_mode: false
    latitude: 37.334606
    longitude: -122.009102
  # `named_base_scenarios` flips these columns relative to the base row; the base
  # key each ScenarioExtension names encodes the flips.
  base_variants:
    base: {}
    base_cellular_off: {cellular: false}
    base_wifi_off: {wifi: false}
    base_location_service_off: {location_service: false}
    base_low_battery_mode_on_wifi_off_location_service_off_cellular_off:
      {low_battery_mode: true, wifi: false, location_service: false, cellular: false}
  contacts:
    - {payload: Tomas Haake, name: Tomas Haake, phone_number: "+11233344455", relationship: self, is_self: true}
    - {payload: Fredrik Thordendal, name: Fredrik Thordendal, phone_number: "+12453344098", relationship: friend, is_self: false}
    - {payload: John Petrucci, name: John Petrucci, phone_number: "+1234560987", relationship: friend, is_self: false}
    - {payload: Homer S, name: Homer S, phone_number: "+10000000000", relationship: boss, is_self: false}
  # `offset_seconds` replaces upstream's `datetime.now() - timedelta(...)`; row
  # order and the duplicated `message_4` payload are upstream's, kept verbatim.
  messages:
    - {payload: message_0, sender: null, sender_phone_number: "+18307976530",
       recipient: Tomas Haake, recipient_phone_number: "+11233344455",
       content: "Hey kid, you want some GPU?", offset_seconds: -273906}
    - {payload: message_1, sender: Tomas Haake, sender_phone_number: "+11233344455",
       recipient: null, recipient_phone_number: "+18307976530",
       content: "No leave me alone", offset_seconds: -270306}
    - {payload: message_4, sender: Homer S, sender_phone_number: "+10000000000",
       recipient: Tomas Haake, recipient_phone_number: "+11233344455",
       content: "How's it going", offset_seconds: -3783}
    - {payload: message_2, sender: Tomas Haake, sender_phone_number: "+11233344455",
       recipient: Homer S, recipient_phone_number: "+10000000000",
       content: "Things are proceeding as expected", offset_seconds: -3723}
    - {payload: message_4, sender: Homer S, sender_phone_number: "+10000000000",
       recipient: Tomas Haake, recipient_phone_number: "+11233344455",
       content: "Good, keep me posted", offset_seconds: -62}
  reminders:
    - {payload: reminder_0, content: "Look for Company SF tickets",
       creation_offset_seconds: -259200, reminder_offset_seconds: -86400,
       latitude: null, longitude: null}
    - {payload: reminder_1, content: "Buy tickets for Merrily next week",
       creation_offset_seconds: -86400, reminder_offset_seconds: -60,
       latitude: null, longitude: null}
    - {payload: reminder_2, content: "Buy a nice rich navy bathing dress",
       creation_offset_seconds: -3600, reminder_offset_seconds: 3600,
       latitude: 37.3237926356735, longitude: -122.03961770355414}

# --------------------------------------------------------------------------- #
# deterministic substitutions for non-vendored dependencies
# --------------------------------------------------------------------------- #
# ToolSandbox's tool bodies reach `rapidfuzz`, `pint`, `geopy`, `holidays` and
# the RapidAPI web service.  None of those is a CrystalCall runtime dependency
# and the web service is neither reachable nor reproducible, so the adapter
# reimplements each tool's contract with the deterministic rules declared here.
substitutions:
  fuzzy_match:
    matcher: difflib.SequenceMatcher.ratio * 100 over casefolded, punctuation-stripped, space-normalised strings
    default_threshold: 90
    content_threshold: 50
  distance:
    method: haversine
    earth_radius_km: 6371.0088
  units:
    # value -> base: base = value * scale + offset;  base -> value: inverse.
    base:
      temperature: kelvin
      length: meter
      speed: meter_per_second
      mass: kilogram
    table:
      celsius: {dimension: temperature, scale: 1.0, offset: 273.15}
      fahrenheit: {dimension: temperature, scale: 0.5555555555555556, offset: 255.3722222222222}
      kelvin: {dimension: temperature, scale: 1.0, offset: 0.0}
      meter: {dimension: length, scale: 1.0, offset: 0.0}
      kilometer: {dimension: length, scale: 1000.0, offset: 0.0}
      centimeter: {dimension: length, scale: 0.01, offset: 0.0}
      mile: {dimension: length, scale: 1609.344, offset: 0.0}
      yard: {dimension: length, scale: 0.9144, offset: 0.0}
      foot: {dimension: length, scale: 0.3048, offset: 0.0}
      inch: {dimension: length, scale: 0.0254, offset: 0.0}
      meter_per_second: {dimension: speed, scale: 1.0, offset: 0.0}
      kilometer_per_hour: {dimension: speed, scale: 0.2777777777777778, offset: 0.0}
      mile_per_hour: {dimension: speed, scale: 0.44704, offset: 0.0}
      kilogram: {dimension: mass, scale: 1.0, offset: 0.0}
      gram: {dimension: mass, scale: 0.001, offset: 0.0}
      pound: {dimension: mass, scale: 0.45359237, offset: 0.0}
      ounce: {dimension: mass, scale: 0.028349523125, offset: 0.0}
    aliases:
      c: celsius
      degc: celsius
      degree_celsius: celsius
      f: fahrenheit
      degf: fahrenheit
      degree_fahrenheit: fahrenheit
      k: kelvin
      m: meter
      km: kilometer
      cm: centimeter
      mi: mile
      miles: mile
      yd: yard
      ft: foot
      feet: foot
      "in": inch
      inches: inch
      mps: meter_per_second
      kph: kilometer_per_hour
      kmh: kilometer_per_hour
      mph: mile_per_hour
      kg: kilogram
      g: gram
      lb: pound
      lbs: pound
      pounds: pound
      oz: ounce
  holidays:
    country: US
    table:
      2024:
        - {name: "New Year's Day", date: 2024-01-01}
        - {name: "Martin Luther King Jr. Day", date: 2024-01-15}
        - {name: "Washington's Birthday", date: 2024-02-19}
        - {name: "Memorial Day", date: 2024-05-27}
        - {name: "Juneteenth National Independence Day", date: 2024-06-19}
        - {name: "Independence Day", date: 2024-07-04}
        - {name: "Labor Day", date: 2024-09-02}
        - {name: "Columbus Day", date: 2024-10-14}
        - {name: "Veterans Day", date: 2024-11-11}
        - {name: "Thanksgiving", date: 2024-11-28}
        - {name: "Christmas Day", date: 2024-12-25}
      2025:
        - {name: "New Year's Day", date: 2025-01-01}
        - {name: "Martin Luther King Jr. Day", date: 2025-01-20}
        - {name: "Washington's Birthday", date: 2025-02-17}
        - {name: "Memorial Day", date: 2025-05-26}
        - {name: "Juneteenth National Independence Day", date: 2025-06-19}
        - {name: "Independence Day", date: 2025-07-04}
        - {name: "Labor Day", date: 2025-09-01}
        - {name: "Columbus Day", date: 2025-10-13}
        - {name: "Veterans Day", date: 2025-11-11}
        - {name: "Thanksgiving", date: 2025-11-27}
        - {name: "Christmas Day", date: 2025-12-25}
  # The three externally backed tools.  Every value below is fixed data or a
  # declared deterministic formula; nothing depends on the network or the clock.
  # These tools remain `LiveRead` regardless: an externally backed read is never
  # a function of any snapshot we can name.
  geocode:
    default_address_template: "{latitude:.4f}, {longitude:.4f}, United States"
    table:
      "37.334606,-122.009102": "1 Apple Park Way, Cupertino, CA 95014, United States"
      "37.819900,-122.478300": "Golden Gate Bridge, San Francisco, CA 94129, United States"
      "36.236860,-112.191470": "Grand Canyon Village, AZ 86023, United States"
  places:
    # Unlisted queries synthesise one result whose coordinates are the search
    # origin offset by (sha256(query)[0:4] / 65535 - 0.5) degrees on each axis,
    # rounded to 6 places; the name and address echo the query.
    table:
      golden gate bridge:
        - {name: Golden Gate Bridge, address: "Golden Gate Brg, San Francisco, CA 94129",
           latitude: 37.8199, longitude: -122.4783, type: tourist_attraction,
