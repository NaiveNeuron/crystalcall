[project]
name = "crystalcall"
version = "0.1.0"
description = "CrystalCall: early, side-effect-free tool launches from the drafts of a diffusion language model"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = [
    "numpy>=2.1",
    "scipy>=1.14",
    "pandas>=2.2",
    "pyarrow>=17",
    "matplotlib>=3.9",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "tqdm>=4.66",
    "tokenizers>=0.20",
]

[project.scripts]
crystalcall = "crystalcall.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.3", "hypothesis>=6.112"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/crystalcall"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
